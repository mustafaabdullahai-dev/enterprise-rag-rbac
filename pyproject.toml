[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-rbac"
version = "0.1.0"
description = "Enterprise RAG assistant with role-based access control (RBAC) and LLM guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abdullah" }]
keywords = ["rag", "rbac", "guardrails", "langgraph", "chromadb", "ragas", "enterprise-security"]

dependencies = [
    # ---- Core framework ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # ---- LangChain / LangGraph orchestration ----
    "langchain-core>=0.3.29",
    "langchain-text-splitters>=0.3.4",
    "langchain-chroma>=0.2.0",
    "langgraph>=0.2.60",
    # ---- Vector store ----
    "chromadb>=0.5.20",
    # ---- Schemas / settings ----
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # ---- Document ingestion (multi-format) ----
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # ---- HTTP (OpenAI-compatible LLM/embedding endpoints) ----
    "httpx>=0.27",
    # ---- Utilities ----
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "rich>=13.7",
]

[project.optional-dependencies]
# Ragas-based answer-quality evaluation (needs an LLM judge endpoint to score).
eval = [
    "ragas>=0.2.6",
    "datasets>=3.0",
    "pandas>=2.2",
    "langchain-openai>=0.2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
enterprise-rag = "enterprise_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B008  - FastAPI's Depends()/Query() in defaults is the idiomatic pattern.
# UP042 - keep `str, Enum` over `StrEnum`: the explicit mixin makes JSON/serialisation
#         behaviour identical across the Python versions this project supports.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Synthetic corpus rows are data, not code: long CSV rows must stay verbatim.
"src/enterprise_rag/demo_corpus.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]
